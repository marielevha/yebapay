spring.application.name=yebapay-core

server.port=${SERVER_PORT:9999}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/yebapay}
spring.datasource.username=${DATABASE_USERNAME:maeva}
spring.datasource.password=${DATABASE_PASSWORD:Maev@123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC

spring.mvc.problemdetails.enabled=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

logging.level.root=INFO
logging.level.com.yebapay.core=INFO

yebapay.security.jwt.issuer=${JWT_ISSUER:yebapay-core}
yebapay.security.jwt.secret=${JWT_SECRET:c29tZS12ZXJ5LWxvbmctZGV2LWp3dC1zZWNyZXQtcGxlYXNlLWNoYW5nZS1tZQ==}
yebapay.security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT24H}

yebapay.auth.refresh-token-ttl=${AUTH_REFRESH_TOKEN_TTL:P30D}
yebapay.auth.password-reset-otp-ttl=${AUTH_PASSWORD_RESET_OTP_TTL:PT10M}
yebapay.auth.password-reset-session-ttl=${AUTH_PASSWORD_RESET_SESSION_TTL:PT15M}
yebapay.auth.otp-resend-cooldown=${AUTH_OTP_RESEND_COOLDOWN:PT30S}
yebapay.auth.otp-length=${AUTH_OTP_LENGTH:6}
yebapay.auth.otp-max-attempts=${AUTH_OTP_MAX_ATTEMPTS:5}

yebapay.wallet.default-currency=${WALLET_DEFAULT_CURRENCY:XAF}
yebapay.wallet.personal-wallet-name=${WALLET_PERSONAL_NAME:Main Wallet}
yebapay.wallet.merchant-wallet-name=${WALLET_MERCHANT_NAME:Merchant Wallet}
yebapay.wallet.personal-daily-limit=${WALLET_PERSONAL_DAILY_LIMIT:1000000}
yebapay.wallet.personal-monthly-limit=${WALLET_PERSONAL_MONTHLY_LIMIT:10000000}
yebapay.wallet.merchant-daily-limit=${WALLET_MERCHANT_DAILY_LIMIT:5000000}
yebapay.wallet.merchant-monthly-limit=${WALLET_MERCHANT_MONTHLY_LIMIT:50000000}

yebapay.qr.secret=${QR_SECRET:eWViYXBheS1xci1zaWduYXR1cmUtc2VjcmV0LXBsZWFzZS1jaGFuZ2UtbWU=}
yebapay.qr.personal-qr-ttl=${QR_PERSONAL_TTL:P3650D}
yebapay.qr.merchant-static-qr-ttl=${QR_MERCHANT_STATIC_TTL:P3650D}
yebapay.qr.money-request-qr-ttl=${QR_MONEY_REQUEST_TTL:PT24H}

yebapay.transaction.pin-max-attempts=${TRANSACTION_PIN_MAX_ATTEMPTS:5}
yebapay.transaction.pin-lock-duration=${TRANSACTION_PIN_LOCK_DURATION:PT15M}
